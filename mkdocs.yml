site_name: terraform-hcloud-infrastructure
site_description: Reusable Terraform modules for managing Hetzner Cloud resources
site_url: https://hetzner-terraform-module.automationdojo.org/
repo_name: AutomationDojo/terraform-hcloud-infrastructure
repo_url: https://github.com/AutomationDojo/terraform-hcloud-infrastructure

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - Overview: modules/overview.md
      - Firewall: modules/firewall.md
      - Server: modules/server.md
      - SSH Keys: modules/ssh-keys.md
