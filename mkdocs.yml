site_name: terraform-hcloud-infrastructure
site_description: Reusable Terraform modules for managing Hetzner Cloud resources
site_url: https://automationdojo.github.io/terraform-hcloud-infrastructure
repo_name: AutomationDojo/terraform-hcloud-infrastructure
repo_url: https://github.com/AutomationDojo/terraform-hcloud-infrastructure

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - glightbox

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Modules:
      - Overview: modules/overview.md
      - Firewall: modules/firewall.md
      - Server: modules/server.md
      - SSH Keys: modules/ssh-keys.md
